<!DOCTYPE html>
<html>
  <head>
    <title>Hacker News</title>
    <link rel="stylesheet" href="./HackerNews.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-left">
          <img class="logo" src="./HackerNewsAssets/y18.svg" alt="Hacker News Logo" />
          <div class="nav-links-container">
            <div class="site-title">Hacker News</div>
            <ul class="nav-links">
              <li>news</li> |
              <li>past</li> |
              <li>comments</li> |
              <li>ask</li> |
              <li>show</li> |
              <li>jobs</li> |
              <li>submit</li> 
            </ul>
          </div>
        </div>
        <div class="login">login</div>
      </nav>

    </header>
    <main>
      <ul class="news-list">
        <li class="news-item">
          <img class="upvote" src="./HackerNewsAssets/triangle.svg" alt="Upvote Arrow" />
          <div class="news-content">
            <div class="news-title">
              Discovery of a new OpenAI agent message board <span>(collusion.wiki)</span>
            </div>
            <div class="news-details">
              863 points by <span>moultano 5 hours ago</span> | <span>hide</span> | <span>661 comments</span>
            </div>
          </div>
        </li>
      </ul>
    </main>
    
  </body>
</html>
